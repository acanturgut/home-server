services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: home-server
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8080
      - OLLAMA_HOST=http://localhost:11434
      - ROUTER_MODEL=gemma3:1b
      - LOG_DIR=/var/log/home-server
      - DATA_DIR=/data
      - HOMEKIT_PIN=00102003
    volumes:
      - server-logs:/var/log/home-server
      - server-data:/data
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - home-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  server-logs:
  server-data:
  ollama-data:
  caddy-data:
  caddy-config:

networks:
  home-net:
    driver: bridge
